version: 2

models:
  - name: stg_vehicle_events
    columns:
      - name: vehicle_id
        tests: [not_null]
      - name: route_id
        tests: [not_null]
      - name: delay_seconds
        tests:
          - dbt_utils.accepted_range:
              min_value: -3600
              max_value: 7200
              config:
                severity: warn
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - vehicle_id
            - event_time
          config:
            severity: warn