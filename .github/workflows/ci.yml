name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check producer/ flink-job/ dashboard/

      - name: Install producer dependencies
        run: pip install -r producer/requirements.txt

      - name: Test producer
        run: pytest producer/ -q

      - name: Install flink-job dependencies
        run: pip install -r flink-job/requirements.txt

      - name: Test flink-job
        run: pytest flink-job/ -q

      - name: Install dashboard dependencies
        run: pip install -r dashboard/requirements.txt pytest

      - name: Test dashboard
        run: pytest dashboard/ -q

      - name: Install dbt
        run: pip install dbt-core dbt-duckdb

      - name: Validate dbt project (compile only, no live data connection)
        working-directory: dbt
        run: |
          dbt deps
          dbt parse